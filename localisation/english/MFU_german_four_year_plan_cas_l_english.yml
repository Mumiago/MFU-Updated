 GER_CAS_doctrine_no_plan_tt:0 "§YGöring's Four Year Plan§! or §YContinue the New Plan§!:\n Its mission also needs §Y550§! deployed Close Air Support planes.\n Göring's plan then also gives §Y500§! Close Air Support planes.\n Schacht's plan then also gives §Y200§! Close Air Support planes.\n Schacht's plan then also gives §Y6§! off-map military factories and §Y6§! off-map civilian factories.\n"
 GER_four_year_plan_cas_bonus_tt:0 "From §YGerman CAS Doctrine§!:\n Gain §Y500§! Close Air Support planes.\n Model: the newest we have researched."
