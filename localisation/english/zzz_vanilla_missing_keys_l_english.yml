 bftb_turkey.144.t: "[FROM.GetName] Seeks Protection"
 bftb_turkey.144.desc: "Representatives from [FROM.GetNameDef] have arrived, requesting that we sign a treaty that would have us back them against any invading nation. As their alignment with our enemies would seriously interfere with our efforts in the Middle East, this promise of protection may be a strategic risk worth taking."
 bftb_turkey.145.t: "[FROM.GetName] Promises Protection"
 bftb_turkey.145.desc: "[FROM.GetAdjective] representatives arrived earlier today to sign a treaty that officially binds [FROM.GetNameDef] to protect us in case our nation comes under attack. This may pave the way for further cooperation with [FROM.GetNameDef]."
 bftb_turkey.145.a: "We can all sleep a little better"
 bftb_turkey.146.t: "[FROM.GetName] Refuses to Protect Us"
 bftb_turkey.146.desc: "After a gathering of the [FROM.GetAdjective] government, it was decided that it would not commit itself to the protection of [ROOT.GetNameDef]. Perhaps they hold an unfavorable view of our government, or they think the promise is too risky."
