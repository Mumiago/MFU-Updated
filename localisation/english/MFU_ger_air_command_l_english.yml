 GER_air_workers_mission:0 "Air Industry Demands"
 GER_air_workers_mission_desc:0 "Every §Y120 days§! the Air Ministry takes §Yall§! our workers. This round it wants at least §Y[?GER_air_quota|0]§!.\nPlane Production Cost for the next round:\n For each §Y10%§! of the demand missing: §R+1%§! (no workers at all: §R+10%§!)\n For each §Y10%§! above it: §G-1%§! (at most §G-20%§!)\nThe demand then rises by §Y2,000§!.\n\n[GetGerAirWorkersResult]"
 GER_air_workers_timeout_tt:0 "The Air Ministry takes §Yall§! workers. Plane Production Cost changes by how many it gets.\nThe demand rises by §Y2,000§!."
 GER_air_workers_start_tt:0 "Starts the §YAir Industry Demands§! mission.\nEvery §Y120 days§! the Air Ministry takes §Yall§! your workers. It wants at least §Y30,000§!, and §Y2,000§! more each round.\nPlane Production Cost for the next round:\n For each §Y10%§! of the demand missing: §R+1%§! (no workers at all: §R+10%§!)\n For each §Y10%§! above it: §G-1%§! (at most §G-20%§!)"
 GER_aircmd_workers_pos_tt:0 " Air industry demands: Production Cost §R+[?GER_air_cost_step|0]%§!\n"
 GER_aircmd_workers_neg_tt:0 " Air industry demands: Production Cost §G[?GER_air_cost_step|0]%§!\n"
 GER_air_workers_result_none_tt:0 "No workers have been taken yet."
 GER_air_workers_result_up_tt:0 "Last round: §Y[?GER_air_last_eaten|0]§! of §Y[?GER_air_last_quota|0]§! workers. Plane production cost: §R+[?GER_air_cost_step|0]%§!."
 GER_air_workers_result_down_tt:0 "Last round: §Y[?GER_air_last_eaten|0]§! of §Y[?GER_air_last_quota|0]§! workers. Plane production cost: §G[?GER_air_cost_step|0]%§!."
