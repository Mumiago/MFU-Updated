 GER_air_workers_mission:0 "Air Industry Demands"
 GER_air_workers_mission_desc:0 "Every §Y120 days§! the Air Ministry takes §Yall§! workers we hold.\nThis round it demands §Y[?GER_air_quota|0]§! workers.\nEach round changes plane production cost:\n Each §Y10%§! of the demand missing: §R+1%§! (no workers: §R+10%§!)\n The full demand: no change\n Each §Y10%§! above the demand: §G-1%§! (twice the demand: §G-10%§!)\nThe changes add up, starting from §G-10%§!.\nThe total stays between §G-20%§! and §R+30%§!.\nThe demand then rises by §Y2,000§!.\n\n[GetGerAirWorkersResult]\n[GetGerAirCostTotal]"
 GER_air_workers_timeout_tt:0 "The Air Ministry takes §Yall§! workers. How many it gets changes plane production cost.\nThe demand rises by §Y2,000§!."
 GER_air_workers_start_tt:0 "Starts the §YAir Industry Demands§! mission.\nEvery §Y120 days§! the Air Ministry takes §Yall§! workers you hold.\nIt demands §Y30,000§! workers, then §Y2,000§! more each round.\nEach round changes plane production cost:\n Each §Y10%§! of the demand missing: §R+1%§! (no workers: §R+10%§!)\n The full demand: no change\n Each §Y10%§! above the demand: §G-1%§! (twice the demand: §G-10%§!)\nThe changes add up, starting from §G-10%§!.\nThe total stays between §G-20%§! and §R+30%§!."
