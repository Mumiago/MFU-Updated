l_english:
 GER_Ural_Bomber_goering_plan_tt:0 "§YGöring's Four Year Plan§!:\n The mission also needs §Y200§! deployed strategic bomber planes.\n Completing the mission also gives §Y250§! strategic bomber planes.\n"
 GER_Ural_Bomber_schacht_plan_tt:0 "§YSchacht's Four Year Plan§!:\n The mission also needs §Y200§! deployed strategic bomber planes.\n Completing the mission also gives §Y100§! strategic bomber planes.\n Completing the mission also gives §Y11§! off-map military factories and §Y11§! off-map civilian factories.\n"
 GER_Ural_Bomber_no_plan_tt:0 "§YGöring's Four Year Plan§! or §YContinue the New Plan§!:\n Its mission also needs §Y200§! deployed strategic bomber planes.\n Göring's plan then also gives §Y250§! strategic bomber planes.\n Schacht's plan then also gives §Y100§! strategic bomber planes.\n Schacht's plan then also gives §Y11§! off-map military factories and §Y11§! off-map civilian factories.\n"
 GER_four_year_plan_ural_bonus_tt:0 "From §YWever's Ural-Bomber§!:\n Gain §Y250§! strategic bomber planes.\n Model: the newest we have researched."
 GER_four_year_plan_schacht_ural_bonus_tt:0 "From §YWever's Ural-Bomber§!:\n Gain §Y100§! strategic bomber planes.\n Model: the newest we have researched."
 GER_udets_strike_force_goering_plan_tt:0 "§YGöring's Four Year Plan§!:\n The mission needs §Y800§! deployed tactical bomber planes instead of §Y450§!.\n Completing the mission also gives §Y400§! tactical bomber planes.\n"
 GER_udets_strike_force_schacht_plan_tt:0 "§YSchacht's Four Year Plan§!:\n The mission needs §Y800§! deployed tactical bomber planes instead of §Y450§!.\n Completing the mission also gives §Y160§! tactical bomber planes.\n Completing the mission also gives §Y8§! off-map military factories and §Y8§! off-map civilian factories.\n"
 GER_udets_strike_force_no_plan_tt:0 "§YGöring's Four Year Plan§! or §YContinue the New Plan§!:\n Its mission needs §Y800§! deployed tactical bomber planes instead of §Y450§!.\n Göring's plan then also gives §Y400§! tactical bomber planes.\n Schacht's plan then also gives §Y160§! tactical bomber planes.\n Schacht's plan then also gives §Y8§! off-map military factories and §Y8§! off-map civilian factories.\n"
 GER_four_year_plan_udet_bonus_tt:0 "From §YUdet's Strike Force§!:\n Gain §Y400§! tactical bomber planes.\n Model: the newest we have researched."
 GER_four_year_plan_schacht_udet_bonus_tt:0 "From §YUdet's Strike Force§!:\n Gain §Y160§! tactical bomber planes.\n Model: the newest we have researched."
 GER_long_range_escorts_reward_tt:0 "Gain §Y200§! heavy fighter planes.\n Model: the newest we have researched."
 GER_Ural_Bomber_heinkel_tt:0 "Strategic bombers built by §YHeinkel§! need §G25%§! fewer resources."
 GER_long_range_escorts_req_tt:0 "Has at least §Y200§! heavy fighter planes in the stockpile (not assigned to air wings)."
 GER_fall_of_the_eagle_autocomplete_tt:0 "This focus cannot be picked. It completes by itself.\nIt waits until §YFührer Directive 21§! has ended.\nThen it completes when the Allies and the Soviet Union have more than §Y2.5§! times the planes of the Axis.\nPlanes in air wings and planes in stock both count.\n§YAllies and Soviet Union§!: [?global.GER_eagle_allied_air|0] planes\n§YAxis§!: [?global.GER_eagle_axis_air|0] planes\n§YNeeded§!: more than [?global.GER_eagle_need_air|0] planes"
 GER_fall_of_the_eagle_retire_tt:0 "§YErnst Udet§! and §YWalther Wever§! retire."
 GER_fall_of_the_eagle_messerschmitt_tt:0 "Planes built by §YMesserschmitt§!:\n Production efficiency growth: §G+20%§!\n Maximum production efficiency: §G+2%§!"
 GER_fall_of_the_eagle_focke_wulf_tt:0 "Planes built by §YFocke-Wulf§! need another §G10%§! fewer resources."
 GER_sturzbomber_desc:0 "The Stuka has shown that a bomb dropped from a steep dive finds its target. Dive bombers can open holes in enemy lines where artillery cannot reach."
 GER_kanonenvogel_desc:0 "A dive bomber with a cannon under each wing hunts tanks as well as trenches. The crews call it the Kanonenvogel, the cannon bird."
 GER_jagdwaffe_investments_desc:0 "The fighter arm decides who owns the sky. Money and attention for the Jagdwaffe will pay back in every battle fought overhead."
 GER_racehorse_desc:0 "Light, fast and quick to climb, the Bf 109 is the racehorse of the Luftwaffe. Messerschmitt will squeeze out every last bit of speed."
 GER_warhorse_desc:0 "The Fw 190 is built to take punishment and keep flying. Focke-Wulf's sturdy design is the warhorse that will carry the fight in the years to come."
 GER_luftwaffe_field_divisions_desc:0 "When planes are lost, ground crews and flak gunners sit idle. Göring will put them in uniform and send them to the front as field divisions."
