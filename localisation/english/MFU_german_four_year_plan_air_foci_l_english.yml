 GER_fall_of_the_eagle_autocomplete_tt:0 "This focus cannot be picked. It completes by itself.\nIt waits until §YFührer Directive 21§! has ended.\nThen it completes when the Allies and the Soviet Union have more than §Y2.5§! times the planes of the Axis.\nPlanes in air wings and planes in stock both count.\n§YAllies and Soviet Union§!: [?global.GER_eagle_allied_air|0] planes\n§YAxis§!: [?global.GER_eagle_axis_air|0] planes\n§YNeeded§!: more than [?global.GER_eagle_need_air|0] planes"
 GER_fall_of_the_eagle_retire_tt:0 "§YErnst Udet§! and §YWalther Wever§! retire."
