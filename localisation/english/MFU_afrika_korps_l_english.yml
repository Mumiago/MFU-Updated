 MFU_ak_desert_tt:0 "Attack in §Ydesert§! and §Ydeep desert§!: §G+[?MFU_ak_desert|G0]%§!"
 MFU_ak_decay_tt:0 "Until §YOperation Barbarossa§! begins, the Soviet Union penalty follows the §YNorth African Campaign§!.\nFrom then on both numbers stay fixed until §Y1942§!. After that the penalty and the desert bonus each shrink by §Y1%§! per month. The spirit is removed when both reach §Y0§!."
 MFU_ak_effect_tt:0 "Deploys §Y3 fully equipped medium tank divisions§! (§Y4 light tank divisions§! without the 1939 or 1940 medium tank technology).\nAdds the §YAfrikakorps§! spirit to the Axis:\n  Attack in desert and deep desert: §G+10%§!\n  §YSoviet Union§! attack and defense: §R-[?MFU_ak_sov|R0]%§! (the current §YNorth African Campaign§! swing plus a flat 10%: Barbarossa's African bonus or malus is cancelled out and replaced by a flat §R-10%§!)\nOnce Barbarossa begins both stay fixed, then fade by §Y1%§! per month from §Y1942§! on.\n§RCannot be used once Barbarossa has begun.§!"
 MFU_ak_spawn_tt:0 "The divisions appear in the first city held by the Axis among §YTunis§!, §YTripoli§!, §YBenghazi§! and §YTobruk§!. A demilitarized Tunisia is skipped."
