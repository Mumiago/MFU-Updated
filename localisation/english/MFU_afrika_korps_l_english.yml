 MFU_ak_desert_tt:0 "Attack in §Ydesert§! and §Ydeep desert§!: §G+[?MFU_ak_desert|G0]%§!"
 MFU_ak_decay_tt:0 "\nThe Soviet penalty grows with the §YNorth African Campaign§! bonus (Britain's spirit: §G+4%§! if the Axis is winning there, §R-4%§! if losing), so together they make §R-10%§! when Barbarossa is launched.\n\n§YUntil Barbarossa is launched:§! the penalty updates weekly and nothing wears off.\n§YAt launch:§! penalty and desert bonus freeze at their current values.\n§YAfter launch, but not before Aug 1941:§! each moves 1 point closer to 0 per month (-12% becomes -11%, +10% becomes +9%).\nThe spirit ends when both reach §Y0§!."
 MFU_ak_spawn_tt:0 "Deploys §Y3 medium Panzer divisions§! (fully equipped, §Y50%§! experience).\nYou get §Y4 light Panzer divisions§! instead if you have neither the 1939 nor the 1940 Medium Tank Chassis.\nThey land in the first Axis-held city in this order:\n§YTunis§! > §YTripoli§! > §YBenghazi§! > §YTobruk§!"
 MFU_ak_effect_tt:0 "\n§YAfrikakorps§! spirit for Germany, the members of its faction when you take this, §YVichy France§! and §YSpain§!:\n  Attack in desert and deep desert: §G+10%§!\n  Attack and defense vs §YSoviet Union§!: §R-[?MFU_ak_sov|R0]%§!\n\nThe Soviet penalty grows with the §YNorth African Campaign§! bonus (Britain's spirit, now [?MFU_ak_africa|+0]%), so together they make §R-10%§!:\n  bonus §G+4%§! (Axis winning) + penalty §R-14%§! = §R-10%§!\n  bonus §Y0%§! + penalty §R-10%§! = §R-10%§!\n  bonus §R-4%§! (Axis losing) + penalty §R-6%§! = §R-10%§!\nSo Barbarossa starts at §R-10%§! however Africa goes.\n\nThe penalty updates weekly until Barbarossa is launched. After launch, penalty and desert bonus wear off from §YAug 1941§!."
 MFU_ak_avail_city_tt:0 "The Axis holds §YTunis§!, §YTripoli§!, §YBenghazi§! or §YTobruk§!\n  Axis = Germany, §YItaly§!, Germany's faction members and subjects\n  A city held by a neutral §YVichy France§! does not count\n  §YTunis§! does not count while Tunisia is a demilitarized zone"
 MFU_ak_avail_france_tt:0 "France has fallen (§YVichy France§! exists)"
 MFU_ak_avail_barb_tt:0 "The §YOperation Barbarossa§! decision has not been taken"
