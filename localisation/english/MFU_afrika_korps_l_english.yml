 MFU_ak_spirit_0:0 "Afrikakorps"
 MFU_ak_spirit_0_desc:0 "The Afrikakorps carries the Axis war in the desert. Its soldiers fight better in the sand, but the Reich pays for it against the Soviet Union: until Barbarossa the penalty cancels the North African Campaign's bonus or malus to §YBarbarossa§! and replaces it with a flat §R-10%§!. Once Barbarossa begins both effects stop changing, and from §Y1942§! on they fade away."
