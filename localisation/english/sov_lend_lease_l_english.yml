l_english:
 SOV_lend_lease_spending:0 "Lend-Lease Spending"
 SOV_lend_lease_spending_desc:0 "Turn Soviet lend-lease into equipment. Tank designs made here store their production cost for later spending."
 SOV_design_lend_lease_tank:0 "Design Tank for Lend Lease"
 SOV_design_lend_lease_tank_desc:0 "Choose a chassis, modules, engine level, and armor level. The resulting design is saved as Lend-Lease Tank, and its production cost is stored."

 sov_lend_lease_tank.1.t:0 "Design Tank for Lend Lease"
 sov_lend_lease_tank.1.d:0 "Choose the class of tank to build from lend-lease. A choice appears only when the United States or the Soviet Union has unlocked it."
 sov_lend_lease_tank.1.a:0 "Light tank"
 sov_lend_lease_tank.1.b:0 "Medium tank"
 sov_lend_lease_tank.1.c:0 "Heavy tank"
 sov_lend_lease_tank.1.e:0 "Neither country has an unlocked chassis"

 sov_lend_lease_tank.2.t:0 "Light Tank Chassis"
 sov_lend_lease_tank.2.d:0 "Choose the light chassis. This is the base production cost before modules."
 sov_lend_lease_tank.2.a:0 "1940 light chassis (7 IC)"
 sov_lend_lease_tank.2.b:0 "1943 light chassis (10.5 IC)"

 sov_lend_lease_tank.3.t:0 "Medium Tank Chassis"
 sov_lend_lease_tank.3.d:0 "Choose the medium chassis. This is the base production cost before modules."
 sov_lend_lease_tank.3.a:0 "1941 medium chassis (12.7 IC)"
 sov_lend_lease_tank.3.b:0 "1943 medium chassis (13.1 IC)"

 sov_lend_lease_tank.4.t:0 "Heavy Tank Chassis"
 sov_lend_lease_tank.4.d:0 "Choose the heavy chassis. This is the base production cost before modules."
 sov_lend_lease_tank.4.a:0 "1941 heavy chassis (25.7 IC)"
 sov_lend_lease_tank.4.b:0 "1944 heavy chassis (29 IC)"

 sov_lend_lease_tank.5.t:0 "Suspension"
 sov_lend_lease_tank.5.d:0 "Choose the suspension. The cost is added to the chassis."
 sov_lend_lease_tank.5.a:0 "Bogie suspension (+1 IC)"
 sov_lend_lease_tank.5.b:0 "Torsion bar suspension (+2 IC)"
 sov_lend_lease_tank.5.c:0 "Interleaved suspension (+3 IC)"
 sov_lend_lease_tank.5.d:0 "Christie suspension (+4 IC)"

 sov_lend_lease_tank.6.t:0 "Engine"
 sov_lend_lease_tank.6.d:0 "Choose the engine. A petrol-electric engine also increases the cost of everything chosen so far by 5%."
 sov_lend_lease_tank.6.a:0 "Gasoline engine (+4 IC)"
 sov_lend_lease_tank.6.b:0 "Diesel engine (+3 IC)"
 sov_lend_lease_tank.6.c:0 "Petrol-electric engine (+4 IC, then +5%)"
 sov_lend_lease_tank.6.d:0 "Gas turbine (+4.5 IC)"

 sov_lend_lease_tank.7.t:0 "Engine Level"
 sov_lend_lease_tank.7.d:0 "Current engine level: [?SOV_ll_engine_level|0]. Each level adds 0.1 IC, up to 20."
 sov_lend_lease_tank.7.a:0 "Increase engine level by 1"
 sov_lend_lease_tank.7.b:0 "Increase engine level by 5"
 sov_lend_lease_tank.7.c:0 "Decrease engine level by 1"
 sov_lend_lease_tank.7.e:0 "Set engine level to 10"
 sov_lend_lease_tank.7.f:0 "Set engine level to 20"
 sov_lend_lease_tank.7.g:0 "Continue"

 sov_lend_lease_tank.8.t:0 "Armor Type"
 sov_lend_lease_tank.8.d:0 "Choose how the armor is built. Riveted armor reduces the cost so far by 4%. Cast armor increases it by 5%. Welded armor does not change the cost."
 sov_lend_lease_tank.8.a:0 "Riveted armor (-4%)"
 sov_lend_lease_tank.8.b:0 "Welded armor"
 sov_lend_lease_tank.8.c:0 "Cast armor (+5%)"

 sov_lend_lease_tank.9.t:0 "Armor Level"
 sov_lend_lease_tank.9.d:0 "Current armor level: [?SOV_ll_armor_level|0]. Each level adds 0.25 IC, up to 20."
 sov_lend_lease_tank.9.a:0 "Increase armor level by 1"
 sov_lend_lease_tank.9.b:0 "Increase armor level by 5"
 sov_lend_lease_tank.9.c:0 "Decrease armor level by 1"
 sov_lend_lease_tank.9.e:0 "Set armor level to 10"
 sov_lend_lease_tank.9.f:0 "Set armor level to 20"
 sov_lend_lease_tank.9.g:0 "Continue"

 sov_lend_lease_tank.10.t:0 "Light Tank Turret"
 sov_lend_lease_tank.10.d:0 "Choose the turret."
 sov_lend_lease_tank.10.a:0 "Two-man turret (+2.5 IC)"
 sov_lend_lease_tank.10.b:0 "Three-man turret (+4 IC)"
 sov_lend_lease_tank.10.c:0 "Oscillating turret (+5 IC)"

 sov_lend_lease_tank.11.t:0 "Medium Tank Turret"
 sov_lend_lease_tank.11.d:0 "Choose the turret."
 sov_lend_lease_tank.11.a:0 "One-man turret (+3 IC)"
 sov_lend_lease_tank.11.b:0 "Two-man turret (+3.5 IC)"
 sov_lend_lease_tank.11.c:0 "Three-man turret (+5.5 IC)"

 sov_lend_lease_tank.12.t:0 "Heavy Tank Turret"
 sov_lend_lease_tank.12.d:0 "Choose the turret."
 sov_lend_lease_tank.12.a:0 "Two-man turret (+5.5 IC)"
 sov_lend_lease_tank.12.b:0 "Three-man turret (+7.5 IC)"
 sov_lend_lease_tank.12.c:0 "Four-man turret (+8.5 IC)"

 sov_lend_lease_tank.13.t:0 "Light Tank Gun"
 sov_lend_lease_tank.13.d:0 "Choose the main gun."
 sov_lend_lease_tank.13.a:0 "Small cannon (+1.5 IC)"
 sov_lend_lease_tank.13.b:0 "Improved small cannon (+2.5 IC)"
 sov_lend_lease_tank.13.c:0 "Close support gun (+2.5 IC)"

 sov_lend_lease_tank.14.t:0 "Medium Tank Gun"
 sov_lend_lease_tank.14.d:0 "Choose the main gun."
 sov_lend_lease_tank.14.a:0 "High-velocity cannon (+3 IC)"
 sov_lend_lease_tank.14.b:0 "Medium cannon (+4.5 IC)"
 sov_lend_lease_tank.14.c:0 "Improved high-velocity cannon (+5 IC)"
 sov_lend_lease_tank.14.e:0 "Neither country has an unlocked gun for this chassis"

 sov_lend_lease_tank.15.t:0 "Heavy Tank Gun"
 sov_lend_lease_tank.15.d:0 "Choose the main gun."
 sov_lend_lease_tank.15.a:0 "Medium cannon (+4.5 IC)"
 sov_lend_lease_tank.15.b:0 "Heavy cannon (+6.5 IC)"
 sov_lend_lease_tank.15.c:0 "Improved heavy cannon (+8 IC)"
 sov_lend_lease_tank.15.e:0 "Neither country has an unlocked gun for this chassis"

 sov_lend_lease_tank.16.t:0 "Armor Shape"
 sov_lend_lease_tank.16.d:0 "Choose the armor layout. This cost is added after the armor-type multiplier."
 sov_lend_lease_tank.16.a:0 "Unsloped armor"
 sov_lend_lease_tank.16.b:0 "Rounded armor (+1 IC)"
 sov_lend_lease_tank.16.c:0 "Sloped armor (+2 IC)"
 sov_lend_lease_tank.16.d:0 "Advanced sloped armor (+3 IC)"

 sov_lend_lease_tank.17.t:0 "Radio"
 sov_lend_lease_tank.17.d:0 "Choose a radio, or leave the slot empty."
 sov_lend_lease_tank.17.a:0 "No radio"
 sov_lend_lease_tank.17.b:0 "Radio (+0.5 IC)"
 sov_lend_lease_tank.17.c:0 "Improved radio (+1 IC)"
 sov_lend_lease_tank.17.d:0 "Advanced radio (+2 IC)"

 sov_lend_lease_tank.18.t:0 "Special Module"
 sov_lend_lease_tank.18.d:0 "Choose one special module, or leave the slot empty."
 sov_lend_lease_tank.18.a:0 "No special module"
 sov_lend_lease_tank.18.b:0 "Stabilizer (+1 IC)"
 sov_lend_lease_tank.18.c:0 "Dozer blade (+1 IC)"
 sov_lend_lease_tank.18.d:0 "Armor skirts (+1.2 IC)"

 sov_lend_lease_tank.19.t:0 "Lend-Lease Tank Design"
 sov_lend_lease_tank.19.d:0 "This design costs [?SOV_ll_tank_cost|.2] IC per tank. That cost is stored for lend-lease spending. Accepting saves the design as Lend-Lease Tank."
 sov_lend_lease_tank.19.a:0 "Accept the design"
 sov_lend_lease_tank.19.b:0 "Cancel"