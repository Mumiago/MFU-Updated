 ROM_corporative_economy:0 "Corporative Economy"
 ROM_corporative_economy_desc:0 "King Carol II's corporatist state binds capital and labour to the Crown's industrial plans."
 ROM_legionary_economy:0 "Legionary Economy"
 ROM_legionary_economy_desc:0 "The Legion's economy runs on zeal and sacrifice. Every factory is a monastery and every worker a soldier of the nation."
 ROM_cult_of_carol:0 "The Cult of Carol"
 ROM_cult_of_carol_desc:0 "Portraits of the King hang in every school and office. The Crown is the nation."
 ROM_oil_for_armaments_idea:0 "Oil for Armaments"
 ROM_oil_for_armaments_idea_desc:0 "Ploiești oil flows to the Reich; German machine tools and know-how flow back to our factories."
 ROM_resurrection_pact:0 "National Resurrection Pact"
 ROM_resurrection_pact_desc:0 "The Legion and the Reich are bound by a common struggle, and German engineers help reorganise our industry."
 ROM_resurrection_pact_2:0 "Arms Against Tyranny"
 ROM_resurrection_pact_2_desc:0 "German arms for Romanian oil. The Legion will be ready when the hour of the crusade strikes."
 ROM_luftwaffe_mission:0 "Deutsche Luftwaffenmission"
 ROM_luftwaffe_mission_desc:0 "Luftwaffe instructors train our pilots and ground crews in modern German methods."
 ROM_luftwaffe_mission_2:0 "Der Adler in Rumänien"
 ROM_luftwaffe_mission_2_desc:0 "Romanian and German squadrons fly side by side, and our airmen learn from the best."

 # Agricultural branch
 ROM_peasant_policy:0 "Support for the Peasantry"
 ROM_peasant_policy_desc:0 "Romania is a nation of smallholders. Keeping them on the land costs the treasury dearly, but the villages repay the state with loyalty."
 ROM_modify_peasant_policy_tt:0 "Modify §YSupport for the Peasantry§! by:\n"
 ROM_gain_peasant_policy_tt:0 "Gain the §YSupport for the Peasantry§! national spirit with:\n"
 ROM_pp_consumer_goods_p3_tt:0 "  Consumer Goods Factories: §R+3%§!"
 ROM_pp_political_power_p10_tt:0 "  Political Power Gain: §G+10%§!"
 ROM_pp_output_p5_tt:0 "  Factory Output: §G+5%§!"
 ROM_electrification:0 "Electrified Countryside"
 ROM_electrification_desc:0 "Power lines now reach the villages and small workshops, and new plants run on cheap electricity."
 ROM_eastern_railway_tt:0 "Upgrades the railway from §YBucharest§! through §YIași§! to §YChișinău§! to level §Y3§!.
"

 # Batch 3
 ROM_soia_unlocks_tt:0 "Unlocks the §YSOIA Chemical Works§! decision to build §Y3§! synthetic oil refineries and §Y3§! synthetic rubber plants.\n"
 ROM_crusade_vs_ussr:0 "Crusade Against Bolshevism"
 ROM_crusade_vs_ussr_desc:0 "The war in the East is a holy war. Every Romanian soldier fights to free Bessarabia and to destroy the Bolshevik menace."
 ROM_civilian_flight_schools:0 "Civilian Flight Schools"
 ROM_civilian_flight_schools_desc:0 "Aero clubs across the country turn young enthusiasts into fighter pilots."
 ROM_soia_category:0 "SOIA"
 ROM_soia_category_desc:0 "With IG Farben's backing, SOIA can build chemical plants across the country."

 # MEFO Bills: Romanian trade (Germany)
 ROM_mefo_romanian_trade:0 "MEFO Bills: Romanian Trade"
 ROM_mefo_romanian_trade_desc:0 "Romanian grain, oil and ore help keep the MEFO Bills afloat."
 ROM_mefo_trade_head_tt:0 "§YGermany§! gains §YMEFO Bills: Romanian Trade§!, modified by:
"
 ROM_mefo_cg_tt:0 "  Consumer Goods Factories: §G-1.5%§!"
 ROM_mefo_output_tt:0 "  Factory Output: §G+5%§!"

 # Army spirits
 ROM_architecture_of_resistance:0 "Architecture of Resistance"
 ROM_architecture_of_resistance_desc:0 "Following French doctrine, our engineers fortify every river line and mountain pass. The enemy will break himself against Romanian concrete."
 ROM_the_sentinel_of_the_motherland:0 "Straja Țării"
 ROM_the_sentinel_of_the_motherland_desc:0 "The Sentinel of the Motherland enrols Romania's youth in the King's own paramilitary organisation."
 ROM_figurehead_king_michael:0 "Figurehead King Michael"
 ROM_figurehead_king_michael_desc:0 "The young King Michael reigns, but real power lies elsewhere."
 ROM_king_carol_ii_hedonist:0 "The Playboy King"
 ROM_king_carol_ii_hedonist_desc:0 "King Carol II's lavish lifestyle and scandals weigh on the Crown's reputation."

 # Batch 5
 ROM_officer_corps:0 "Romanian Officer Corps"
 ROM_officer_corps_desc:0 "Our officer corps is riddled with corruption, nepotism and outdated thinking. Only deep reforms can turn it into a modern fighting force."
 ROM_modify_officer_corps_tt:0 "Modify §YRomanian Officer Corps§! by:\n"
 ROM_oc_org_set_m0_05_tt:0 "  Organization becomes §R-5%§!"
 ROM_oc_org_set_m0_1_tt:0 "  Organization becomes §R-10%§!"
 ROM_oc_recruit_add_p0_1_tt:0 "  Recruitable Population: §G+10%§!"
 ROM_oc_attack_add_p0_02_tt:0 "  Division Attack: §G+2%§!"
 ROM_oc_org_set_p0_1_tt:0 "  Organization becomes §G+10%§!"
 ROM_oc_attack_add_p0_015_tt:0 "  Division Attack: §G+1.5%§!"
 ROM_royal_foundation_tt:0 "§YRADAR§!, §YExpand SET Facilities§! and §YSubsidise Reșița Works§! take §G45§! fewer days.\n"
 ROM_resita_reichswerke_tt:0 "The §YReichswerke Hermann Göring§! industrial concern gains §G+5%§! Factory Output.\n"
 ROM_agrarian_export_economy:0 "Grain for Export"
 ROM_agrarian_export_economy_desc:0 "Large estates now farm for export markets, and the hard currency they earn pays for our industrial development."
 ROM_royal_foundation_idea:0 "Royal Foundation for Arts and Sciences"
 ROM_royal_foundation_idea_desc:0 "The Crown's foundation sponsors our universities, laboratories and young scientists."
 ROM_soia_chemical_works:0 "SOIA Chemical Works"
 ROM_soia_chemical_works_desc:0 "With IG Farben's backing, SOIA builds synthetic fuel refineries and Buna rubber plants."

