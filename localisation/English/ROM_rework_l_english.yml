 # The Camarilla (King path corruption meter)
 ROM_camarilla_dm:0 "The Camarilla"
 ROM_camarilla_dm_desc:0 "King Carol's circle of favourites runs the country through bribes and patronage. The more corrupt the court, the more political favours we can call in, and the less the people trust the state.\n\nCorruption: §Y[?ROM_camarilla|0]§!/100"
 rom_rework.21.t:0 "Scandal at the Palace"
 rom_rework.21.desc:0 "The newspapers can no longer be silenced. Stories of Madame Lupescu's villas, rigged contracts and royal kickbacks are being passed from hand to hand in every cafe in Bucharest, and the Legion is making the most of it."
 rom_rework.21.a:0 "The King will weather this."
 rom_rework.22.t:0 "The Camarilla Crisis"
 rom_rework.22.desc:0 "The corruption of the King's circle has become intolerable. Ministers resign, officers grumble openly and crowds gather outside the palace. Some favourites will have to be sacrificed to calm the storm."
 rom_rework.22.a:0 "Throw them a few scapegoats."
 ROM_camarilla_crisis_reset_tt:0 "Corruption falls to §Y70§!.\n"
 ROM_camarilla_category:0 "The Camarilla"
 ROM_camarilla_category_desc:0 "Corruption: §Y[?ROM_camarilla|0]§!/100. Every point of corruption gives §G+0.2%§! political power gain and §R-0.2%§! stability. Corruption grows each week, faster for every Camarilla favourite serving as an advisor."
 ROM_purge_a_courtier:0 "Purge a Courtier"
 ROM_purge_a_courtier_desc:0 "Sacrifice one of the King's favourites to show the nation that the Crown is not above the law."
 ROM_royal_gala:0 "Royal Gala"
 ROM_royal_gala_desc:0 "A lavish gala at the palace. Contracts are signed over champagne, favours are traded and everyone leaves owing the King something."
 ROM_buy_loyalties:0 "Buy Loyalties"
 ROM_buy_loyalties_desc:0 "Quiet payments to editors, union leaders and county prefects will keep the peace, for a price."
