l_english:
 # Romania rework - national spirits added by focus rewards
 ROM_german_military_mission:0 "German Military Mission"
 ROM_german_military_mission_desc:0 "Officers of the Deutsche Heeresmission are attached to our divisions, drilling our troops in modern German methods."
 ROM_winter_preparations:0 "Winter Preparations"
 ROM_winter_preparations_desc:0 "The bitter winter of 1941 taught us hard lessons. Our troops are now issued proper winter clothing and our supply columns are ready for the snow."

 # A.C.E.X. resource prospecting (King's path)
 ROM_acex_category:0 "A.C.E.X. Prospecting"
 ROM_acex_category_desc:0 "With the Crown's blessing, A.C.E.X. surveys the riches beneath Romanian soil. Every concession granted fills the national stockpile, and no doubt the pockets of the Camarilla too."
 ROM_acex_unlocks_tt:0 "Unlocks the §YA.C.E.X. Prospecting§! decisions, letting us expand §Yoil§!, §Ysteel§!, §Ychromium§!, §Yaluminium§! and §Ytungsten§! extraction, and to open oil fields in §YOltenia§!.\n"
 ROM_acex_max_uses_tt:0 "This concession has been granted fewer than §Y3§! times."
 ROM_acex_ploiesti_oil:0 "Open New Ploiesti Oil Concessions"
 ROM_acex_ploiesti_oil_desc:0 "The Prahova valley still holds untapped oil. New drilling concessions around Ploiesti will make the black gold flow faster."
 ROM_acex_hunedoara_steel:0 "Expand the Hunedoara Ironworks"
 ROM_acex_hunedoara_steel_desc:0 "The iron ore of the Poiana Rusca mountains feeds the furnaces of Hunedoara. More mines mean more steel for the Kingdom."
 ROM_acex_banat_chromium:0 "Survey the Banat Chromite Deposits"
 ROM_acex_banat_chromium_desc:0 "The mountains of the Banat hide valuable chromite. A.C.E.X. engineers are ready to open new shafts."
 ROM_acex_bihor_bauxite:0 "Exploit the Bihor Bauxite"
 ROM_acex_bihor_bauxite_desc:0 "The bauxite of the Padurea Craiului hills can supply aluminium for our aircraft industry, if only we invest in extracting it."
 ROM_acex_apuseni_tungsten:0 "Open the Apuseni Tungsten Mines"
 ROM_acex_apuseni_tungsten_desc:0 "The Apuseni mountains are rich in rare ores. A.C.E.X. surveyors believe tungsten can be extracted there in useful quantities."

 # Corpul Muncitoresc Legionar - map decisions (Legion's path)
 ROM_legion_work_corps_category:0 "Corpul Muncitoresc Legionar"
 ROM_legion_work_corps_category_desc:0 "The Legionary Workers' Corps sends its volunteer brigades wherever the nation needs them, building roads and raising factories with their own hands."
 ROM_legion_work_corps_unlocks_tt:0 "Unlocks the §YCorpul Muncitoresc Legionar§! map decisions, letting us build §Yinfrastructure§! and §Ycivilian factories§! in our core states (up to §Y4§! factories).\n"
 ROM_legion_workshops_unlocks_tt:0 "Unlocks the §YLegionary Workshops§! map decision, letting us build up to §Y3§! §Ymilitary factories§! in our core states.\n"
 ROM_legion_relief_works_tt:0 "The §YCorpul Muncitoresc Legionar§! may build §Y2§! more civilian factories.\n"
 ROM_legion_factory_cap_tt:0 "The Corps has built fewer factories than its limit allows (§Y[?ROM_legion_factories_built|0]§! of §Y[?ROM_legion_factory_cap|0]§!)."
 ROM_legion_workshop_cap_tt:0 "The Corps has built fewer than §Y3§! military factories (§Y[?ROM_legion_workshops_built|0]§! built)."
 ROM_legion_build_roads:0 "Legionary Road Works in [FROM.GetName]"
 ROM_legion_build_roads_desc:0 "Costs §Y2k§! manpower. Brigades of Legionary volunteers will pave the roads of [FROM.GetName]. Once per state, in Muntenia, Moldova, Oltenia and Banat; it must come before a Legionary factory there."
 ROM_legion_raise_factory:0 "Raise a Legionary Factory in [FROM.GetName]"
 ROM_legion_raise_factory_desc:0 "Costs §Y5k§! manpower. With volunteer labour and the zeal of the Legion, a new factory will rise in [FROM.GetName]. Once per state; in Muntenia, Moldova, Oltenia and Banat only after the Road Works."
 ROM_legion_raise_workshop:0 "Legionary Workshops in [FROM.GetName]"
 ROM_legion_raise_workshop_desc:0 "Costs §Y5k§! manpower. The Legion will equip its own. One per state, and only where a Legionary factory already stands."

 # Spanish Civil War
 ROM_volunteers_in_spain:0 "Volunteers"
 ROM_volunteers_in_spain_desc:0 "Many Romanians are willing to take up arms abroad for a cause they believe in, should the state allow it."
 ROM_volunteers_in_spain2:0 "Crusade Against Atheism"
 ROM_volunteers_in_spain2_desc:0 "Following the example of Ion Mota and Vasile Marin, Romanian volunteers ride out to fight the godless Republicans in Spain."

 # Army / Navy
 ROM_army_war_college_2:0 "Army War College"
 ROM_army_war_college_2_desc:0 "Our officers now study close cooperation with the air force. Stukas and bombers are treated as flying artillery, called in to break the enemy line."
 ROM_regia_marina_tt:0 "§YItaly§! gains §G+1%§! Naval Damage and §G+1%§! Naval Defense in its §YRegia Marina§! spirit.\n"

 # Political tree, Germany deals and air tree
 ROM_modify_corporative_economy_tt:0 "Modify §YCorporative Economy§! by:\n"
 ROM_modify_legionary_economy_tt:0 "Modify §YLegionary Economy§! by:\n"
 ROM_gain_ROM_corporative_economy_tt:0 "Gain the §YCorporative Economy§! national spirit with:\n"
 ROM_ce_consumer_goods_m3_tt:0 "  Consumer Goods Factories: §G-3%§!"
 ROM_ce_civ_speed_p5_tt:0 "  Civilian Factory Construction Speed: §G+5%§!"
 ROM_ce_building_speed_p5_tt:0 "  Construction Speed: §G+5%§!"
 ROM_ce_consumer_goods_m2_tt:0 "  Consumer Goods Factories: §G-2%§!"
 ROM_ce_civ_speed_p10_tt:0 "  Civilian Factory Construction Speed: §G+10%§!"
 ROM_gain_ROM_legionary_economy_tt:0 "Gain the §YLegionary Economy§! national spirit with:\n"
 ROM_le_mil_speed_p15_tt:0 "  Military Factory Construction Speed: §G+15%§!"
 ROM_le_output_p3_tt:0 "  Factory Output: §G+3%§!"
 ROM_le_consumer_goods_p2_tt:0 "  Consumer Goods Factories: §R+2%§!"
 ROM_le_output_p5_tt:0 "  Factory Output: §G+5%§!"
 ROM_le_mil_speed_p10_tt:0 "  Military Factory Construction Speed: §G+10%§!"
 ROM_le_consumer_goods_p1_tt:0 "  Consumer Goods Factories: §R+1%§!"
 ROM_corporative_economy:0 "Corporative Economy"
 ROM_corporative_economy_desc:0 "King Carol II's corporatist state binds capital and labour to the Crown's industrial plans."
 ROM_legionary_economy:0 "Legionary Economy"
 ROM_legionary_economy_desc:0 "The Legion's economy runs on zeal and sacrifice. Every factory is a monastery and every worker a soldier of the nation."
 ROM_cult_of_carol:0 "The Cult of Carol"
 ROM_cult_of_carol_desc:0 "Portraits of the King hang in every school and office. The Crown is the nation."
 ROM_oil_for_armaments_idea:0 "Oil for Armaments"
 ROM_oil_for_armaments_idea_desc:0 "Ploiesti oil flows to the Reich; German machine tools and know-how flow back to our factories."
 ROM_resurrection_pact:0 "National Resurrection Pact"
 ROM_resurrection_pact_desc:0 "The Legion and the Reich are bound by a common struggle, and German engineers help reorganise our industry."
 ROM_resurrection_pact_2:0 "Arms Against Tyranny"
 ROM_resurrection_pact_2_desc:0 "German arms for Romanian oil. The Legion will be ready when the hour of the crusade strikes."
 ROM_luftwaffe_mission:0 "Deutsche Luftwaffenmission"
 ROM_luftwaffe_mission_desc:0 "Luftwaffe instructors train our pilots and ground crews in modern German methods."
 ROM_luftwaffe_mission_2:0 "Der Adler in Rumänien"
 ROM_luftwaffe_mission_2_desc:0 "Romanian and German squadrons fly side by side, and our airmen learn from the best."

 # Agricultural branch
 ROM_peasant_policy:0 "Support for the Peasantry"
 ROM_peasant_policy_desc:0 "Romania is a nation of smallholders. Keeping them on the land costs the treasury dearly, but the villages repay the state with loyalty."
 ROM_modify_peasant_policy_tt:0 "Modify §YSupport for the Peasantry§! by:\n"
 ROM_gain_peasant_policy_tt:0 "Gain the §YSupport for the Peasantry§! national spirit with:\n"
 ROM_pp_consumer_goods_p3_tt:0 "  Consumer Goods Factories: §R+3%§!"
 ROM_pp_political_power_p10_tt:0 "  Political Power Gain: §G+10%§!"
 ROM_pp_output_p5_tt:0 "  Factory Output: §G+5%§!"
 ROM_electrification:0 "Electrified Countryside"
 ROM_electrification_desc:0 "Power lines now reach the villages and small workshops, and new plants run on cheap electricity."
 ROM_eastern_railway_tt:0 "Upgrades the railway from §YBucharest§! through §YIasi§! to §YChisinau§! to level §Y5§!.\n"

 # Batch 3
 ROM_soia_unlocks_tt:0 "Unlocks the §YSOIA Chemical Works§! decision to build §Y3§! synthetic oil refineries and §Y3§! synthetic rubber plants.\n"
 ROM_crusade_vs_ussr:0 "Crusade Against Bolshevism"
 ROM_crusade_vs_ussr_desc:0 "The war in the East is a holy war. Every Romanian soldier fights to free Bessarabia and to destroy the Bolshevik menace."
 ROM_civilian_flight_schools:0 "Civilian Flight Schools"
 ROM_civilian_flight_schools_desc:0 "Aero clubs across the country turn young enthusiasts into fighter pilots."
 ROM_soia_category:0 "SOIA"
 ROM_soia_category_desc:0 "With IG Farben's backing, SOIA can build chemical plants across the country."

 # MEFO Bills: Romanian trade (Germany)
 ROM_mefo_romanian_trade:0 "MEFO Bills: Romanian Trade"
 ROM_mefo_romanian_trade_desc:0 "Romanian grain, oil and ore help keep the MEFO Bills afloat. This spirit is lost once the MEFO Bills end."
 ROM_mefo_trade_head_tt:0 "§YGermany§! gains §YMEFO Bills: Romanian Trade§!, modified by:\n"
 ROM_mefo_cg_tt:0 "  Consumer Goods Factories: §G-1.5%§!"
 ROM_mefo_output_tt:0 "  Factory Output: §G+5%§!"

 # Army spirits
 ROM_architecture_of_resistance:0 "Architecture of Resistance"
 ROM_architecture_of_resistance_desc:0 "Following French doctrine, our engineers fortify every river line and mountain pass. The enemy will break himself against Romanian concrete."
 ROM_the_sentinel_of_the_motherland:0 "Straja Tarii"
 ROM_the_sentinel_of_the_motherland_desc:0 "The Sentinel of the Motherland enrols Romania's youth in the King's own paramilitary organisation."
 ROM_figurehead_king_michael:0 "Figurehead King Michael"
 ROM_figurehead_king_michael_desc:0 "The young King Michael reigns, but real power lies elsewhere."
 ROM_king_carol_ii_hedonist:0 "The Playboy King"
 ROM_king_carol_ii_hedonist_desc:0 "King Carol II's lavish lifestyle and scandals weigh on the Crown's reputation."

 # Batch 5
 ROM_officer_corps:0 "Romanian Officer Corps"
 ROM_officer_corps_desc:0 "Our officer corps is riddled with corruption, nepotism and outdated thinking. Only deep reforms can turn it into a modern fighting force."
 ROM_modify_officer_corps_tt:0 "Modify §YRomanian Officer Corps§! by:\n"
 ROM_oc_recruit_add_p0_1_tt:0 "  Recruitable Population: §G+10%§!"
 ROM_oc_attack_add_p0_02_tt:0 "  Division Attack: §G+2%§!"
 ROM_oc_attack_add_p0_015_tt:0 "  Division Attack: §G+1.5%§!"
 ROM_royal_foundation_tt:0 "§YRADAR§!, §YExpand SET Facilities§! and §YSubsidise Resita Works§! take §G45§! fewer days.\n"
 ROM_resita_reichswerke_tt:0 "The §YResita Works UCM§! industrial concern gains §G+5%§! Factory Output (§G+15%§! in total).\n"
 ROM_agrarian_export_economy:0 "Grain for Export"
 ROM_agrarian_export_economy_desc:0 "Large estates now farm for export markets, and the hard currency they earn pays for our industrial development."
 ROM_royal_foundation_idea:0 "Bucharest Sociological School"
 ROM_royal_foundation_idea_desc:0 "Dimitrie Gusti's teams of students and researchers study every corner of rural Romania, and the state's scientific life flourishes around them."
 ROM_soia_chemical_works:0 "SOIA Chemical Works"
 ROM_soia_chemical_works_desc:0 "With IG Farben's backing, SOIA builds synthetic fuel refineries and Buna rubber plants."

 # Batch 6
 ROM_oc_leader_cost_add_m0_5_tt:0 "  Army Leader Cost: §G-50%§!"
 ROM_oc_xp_add_p0_05_tt:0 "  Army Experience Gain: §G+5%§!"
 ROM_oc_xp_add_p0_35_tt:0 "  Army Experience Gain: §G+35%§!"
 ROM_oc_cas_add_p0_2_tt:0 "  Ground Support: §G+20%§!"
 ROM_le_consumer_goods_m0_2_tt:0 "  Consumer Goods Factories: §G-0.2%§!"

 # Agrarian economy tooltips
 ROM_agri_recovery_tt:0 "Modify §YAgrarian Economy§! by:\n  Consumer Goods Factories: §G-5%§!"
 ROM_agri_amend_tt:0 "Modify §YAgrarian Economy§! by:\n  Consumer Goods Factories: §G-2.5%§!"
 ROM_agri_upper_tt:0 "§YAgrarian Economy§! becomes §YEffectivized Agrarian Economy§!:\n  Consumer Goods Factories: §G-5%§!\n  Industry research malus of §R-25%§! removed"
 ROM_agri_grain_tt:0 "§YEffectivized Agrarian Economy§! becomes §YGrain for Export§!:\n  Consumer Goods Factories: §G-2.5%§!\n  Industry Research Speed: §G+15%§!"
 ROM_oc_org_add_p0_2_tt:0 "  Organization: §G+20%§!"
 ROM_oc_org_add_p0_05_tt:0 "  Organization: §G+5%§!"
 ROM_oc_org_add_p0_1_tt:0 "  Organization: §G+10%§!"

 # Antonescu economy and Iron Guard
 ROM_cancicov_tt:0 "§YMircea Cancicov§! becomes available as a §YPolitical Advisor§! (§YSpecial Commissar§!):\n  Max Factory Efficiency: §G+10%§!\n  Factory Output: §G+10%§!"
 ROM_strikes_outlawed:0 "Strikes Outlawed"
 ROM_strikes_outlawed_desc:0 "Strikes are now treated as sabotage. Production lines keep running whatever the workers think."
 ROM_petroleum_law:0 "Petroleum Law of 1941"
 ROM_petroleum_law_desc:0 "The state now encourages and rewards those who discover and exploit new oil and mineral deposits."
 ROM_special_commissar:0 "Special Commissar"
 ROM_mircea_cancicov:0 "Mircea Cancicov"

 # Oltenia / one-party state
 ROM_acex_oltenia_oil:0 "Open the Oltenian Oil Fields"
 ROM_acex_oltenia_oil_desc:0 "Drilling around Ticleni and the Gorj hills could turn Oltenia into a second Prahova. If the Reich holds the rights to Oltenia, every new well will fuel German tanks rather than our own."
 ROM_one_party_state:0 "One-Party State"
 ROM_one_party_state_desc:0 "Parliament is gone and with it every rival party. Support for the regime now translates directly into order on the streets."

 # Crown vs Legion balance of power
 ROM_power_balance:0 "Crown and the Legion"
 ROM_power_balance_desc:0 "The Iron Guard has grown into a mass movement with its own nests, work camps and death squads. The bar shows who holds real power in Romania.\n\n§YCrown§! side: stability, political power and faster factory efficiency growth, which suits a heavy-industry, armoured army.\n§YLegion§! side: war support, weekly manpower and recruitable population, which suits a mass infantry army, but costs stability and political power. While the King rules, a strong Legion also brings Iron Guard terror events.\n\nKing focuses push towards the Crown and Legion focuses towards the Legion. The Legion can rally its supporters more cheaply and more often than the Crown can make arrests.\n\nOnce Romania joins a faction the struggle is frozen in place. It ends with §YLegionnaires' Rebellion§!, whose outcome depends on where the bar stands."
 ROM_crown_side:0 "The Crown"
 ROM_legion_side:0 "The Legion"
 ROM_balance_range:0 "Power Struggle"
 ROM_crown_low_range:0 "Crown Ascendant"
 ROM_crown_medium_range:0 "Crown in Control"
 ROM_crown_high_range:0 "Legion Crushed"
 ROM_legion_low_range:0 "Legion Agitating"
 ROM_legion_medium_range:0 "Legion on the March"
 ROM_legion_high_range:0 "Legion Triumphant"
 ROM_balance_of_power_category:0 "The Crown and the Legion"
 ROM_arrest_legionary_leaders:0 "Arrest Legionary Leaders"
 ROM_arrest_legionary_leaders_desc:0 "The Siguranta has a list of names. A wave of arrests will cut the head off the Legion's local nests."
 ROM_shot_while_trying_to_escape:0 "Shot While Trying to Escape"
 ROM_shot_while_trying_to_escape_desc:0 "A night transfer between prisons, a lonely forest road, and a convenient report. The Captain and his closest men will trouble the Crown no more."
 ROM_legionary_rallies:0 "Legionary Rallies"
 ROM_legionary_rallies_desc:0 "Green-shirted columns march through every town, singing the hymns of the Legion."
 ROM_echipa_mortii:0 "Unleash the Echipa Mortii"
 ROM_echipa_mortii_desc:0 "The Legion's death squads are ready to strike at those who stand in the way of the national revolution."

 # Army style spirits
 ROM_royal_armament_programme:0 "Royal Armament Programme"
 ROM_royal_armament_programme_desc:0 "The Crown invests in heavy industry and modern armour, hoping to give Romania an army of steel rather than numbers."
 ROM_legionary_volunteers:0 "Legionary Volunteers"
 ROM_legionary_volunteers_desc:0 "The nests of the Legion send their young men to the colours by the thousand. What the army lacks in machines it makes up for in faith and numbers."

 # Joining the Axis
 ROM_axis_category:0 "Romania and the Axis"
 ROM_axis_category_desc:0 "The Crown will not tie Romania to Berlin lightly. Only when war comes to the Balkans will the King open the country to the Wehrmacht."
 ROM_forward_base_for_marita:0 "Forward Base for the Balkan Campaign"
 ROM_forward_base_for_marita_desc:0 "With war raging in Greece, Berlin needs Romanian soil to stage its divisions. Opening our borders to the Wehrmacht means stepping into the Axis camp."
 ROM_can_join_axis_tt:0 "Romania can now §Yjoin a faction§!.\n"

 # German-Romanian economic integration
 ROM_german_romanian_economic_integration:0 "Romanian Economic Integration"
 ROM_german_romanian_economic_integration_desc:0 "German managers and capital now run much of Romanian industry, tying its output directly to the needs of the Reich."

 # Resita / Reichswerke
 ROM_electrification_upper_tt:0 "§Y+1 Civilian Factory§! for each completed §YUpper Strata§! focus: §YFavour the Upper Strata§!, §YInsist on Extensive Agriculture§!, §YTackle the Underemployment§!.\n"
 ROM_electrification_small_tt:0 "§Y+1 Military Factory§! for each completed §YSmall Peasantry§! focus: §YSupport the Small Peasantry§!, §YTax Exemptions and Credit§!, §YEnd the Fragmentation of Smallholdings§!.\n"
 ROM_electrification_grain_tt:0 "If §YEncourage Raising Grain for Export§! is completed: gain §YElectrified Estates§! (Civilian Factory Construction Speed §G+10%§!).\n"
 ROM_electrification_training_tt:0 "If §YProvide Peasants Specialised Training§! is completed: gain §YElectrified Villages§! (Factory Output §G+5%§!).\n"
 ROM_struggle_resolved_tt:0 "The struggle between §YThe Crown§! and §YThe Legion§! has been resolved"
 ROM_industry_bop_starts_tt:0 "Begins the struggle for control of Romanian industry between §YRomanian§! and §YGerman§! interests.\n"
 ROM_industry_balance:0 "Romanian Industry and the Reich"
 ROM_industry_balance_desc:0 "Antonescu's state has taken the economy in hand, but German capital and managers are flooding in.\n\n§YRomanian Control§!: stability, faster construction and more resources for Romania.\n§YGerman Control§!: §YGermany§! gains factory output and efficiency through its own spirit, while Romania pays in stability and political power.\n\n§YDecree Law§! focuses such as the §YPetroleum Law§! and the §YGeneral Commissariat for Petroleum§! keep industry Romanian. §YSincere Integration§!, §YReorganisation under German Auspices§! and the §YReichswerke§! hand it to Germany."
 ROM_romanian_industry_side:0 "Romanian Control"
 ROM_german_industry_side:0 "German Control"
 ROM_industry_balance_range:0 "Contested Industry"
 ROM_romanian_industry_low_range:0 "Romanian Management"
 ROM_romanian_industry_medium_range:0 "National Industry"
 ROM_romanian_industry_high_range:0 "Economic Sovereignty"
 ROM_german_industry_low_range:0 "German Advisers"
 ROM_german_industry_medium_range:0 "German Management"
 ROM_german_industry_high_range:0 "Arsenal of the Reich"
 ROM_industry_balance_category:0 "Romanian Industry and the Reich"
 ROM_appoint_romanian_commissars:0 "Appoint Romanian Commissars"
 ROM_appoint_romanian_commissars_desc:0 "Under the Decree Law, state commissars can be placed in any enterprise to keep it working for Romania rather than Berlin."
 ROM_invite_german_capital:0 "Invite German Capital"
 ROM_invite_german_capital_desc:0 "German banks and concerns are eager to buy into Romanian industry. Their money builds factories, but their managers answer to Berlin."
 ROM_electrified_estates:0 "Electrified Estates"
 ROM_electrified_estates_desc:0 "Power lines now reach the great estates, and their owners invest the profits from grain exports in new industry."
 ROM_electrified_villages:0 "Electrified Villages"
 ROM_electrified_villages_desc:0 "Trained peasants and cheap electricity have turned village workshops into a reserve of skilled industrial labour."
 ROM_cgp:0 "General Commissariat for Petroleum"
 ROM_cgp_desc:0 "The Commissariat supervises, coordinates and directs the production, refining, sale and export of oil in accordance with the interests of the country."
 ROM_sincere_integration:0 "Romanian Sincere Integration"
 ROM_sincere_integration_desc:0 "Romania has committed to integrating its economy with the Reich's war plans."
 ROM_resita_blocks_reichswerke_tt:0 "The §YReichswerke Hermann Goring§! industrial concern can no longer be hired, and is dismissed if already hired.\n"
 ROM_reich_romanian_industry_1:0 "Romanian Industry: German Advisers"
 ROM_reich_romanian_industry_1_desc:0 "German managers increasingly run Romanian industry for the Reich. This spirit follows the balance between Romanian and German control of Romania's industry."
 ROM_reich_romanian_industry_2:0 "Romanian Industry: German Management"
 ROM_reich_romanian_industry_2_desc:0 "German managers increasingly run Romanian industry for the Reich. This spirit follows the balance between Romanian and German control of Romania's industry."
 ROM_reich_romanian_industry_3:0 "Romanian Industry: Arsenal of the Reich"
 ROM_reich_romanian_industry_3_desc:0 "German managers increasingly run Romanian industry for the Reich. This spirit follows the balance between Romanian and German control of Romania's industry."
 ROM_auto_focus_tt:0 "This focus is carried out by §YMircea Cancicov§! after the §YDecree Law for the Protection of the National Economy§!"
 ROM_auto_focus_start_tt:0 "§YMircea Cancicov§! will carry out the focuses below this one §Yautomatically§!, one every §Y35§! days, in a §Yrandom order§!.\n"
 ROM_reichswerke_distrust_tt:0 "Because we kept the §YResita Works§! out of German hands, Berlin no longer trusts us:"
 ROM_german_distrust:0 "German Distrust"
 ROM_german_distrust_desc:0 "We refused to hand the Resita Works to the Reichswerke. Berlin now delays deliveries, withdraws its engineers and squeezes our industry wherever it can."
 ROM_auto_focus_progress_tt:0 "§Y$CHARACTER$§! is working on this focus.\nProgress: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
 ROM_parasutisti_tt:0 "Form a §Yveteran paratrooper division§!.\n"
 ROM_infanterie_marina_tt:0 "Form §Ythree experienced marine divisions§! in Constanta.\n"

 # Cancicov's missions (auto-run Decree Law branch)
 ROM_the_petroleum_law_of_1941_mission:0 "Commissar at Work: The Petroleum Law of 1941"
 ROM_the_petroleum_law_of_1941_mission_desc:0 "§YMircea Cancicov§! is carrying out §YThe Petroleum Law of 1941§!. The focus completes when the timer runs out."
 ROM_militarisation_of_all_the_enterprises_mission:0 "Commissar at Work: Militarisation of all Enterprises"
 ROM_militarisation_of_all_the_enterprises_mission_desc:0 "§YMircea Cancicov§! is carrying out §YMilitarisation of all Enterprises§!. The focus completes when the timer runs out."
 ROM_outlaw_strikes_mission:0 "Commissar at Work: Outlaw Strikes"
 ROM_outlaw_strikes_mission_desc:0 "§YMircea Cancicov§! is carrying out §YOutlaw Strikes§!. The focus completes when the timer runs out."
 ROM_politica_de_integrare_sincera_mission:0 "Commissar at Work: Politica de Integrare Sincera"
 ROM_politica_de_integrare_sincera_mission_desc:0 "§YMircea Cancicov§! is carrying out §YPolitica de Integrare Sincera§!. The focus completes when the timer runs out."
 ROM_commisariatul_general_al_petrolului_mission:0 "Commissar at Work: Commisariatul General al Petrolului"
 ROM_commisariatul_general_al_petrolului_mission_desc:0 "§YMircea Cancicov§! is carrying out §YCommisariatul General al Petrolului§!. The focus completes when the timer runs out."
 ROM_reorganise_the_economy_under_german_auspices_mission:0 "Commissar at Work: Reorganise the Economy under German Auspices"
 ROM_reorganise_the_economy_under_german_auspices_mission_desc:0 "§YMircea Cancicov§! is carrying out §YReorganise the Economy under German Auspices§!. The focus completes when the timer runs out."
 ROM_reichswerke_hermann_goering_mission:0 "Commissar at Work: Reichswerke Hermann Goering"
 ROM_reichswerke_hermann_goering_mission_desc:0 "§YMircea Cancicov§! is carrying out §YReichswerke Hermann Goering§!. The focus completes when the timer runs out."
 ROM_baita_transylvania_tt:0 "Romania still holds §YNorthern Transylvania§!, §YCrisana§! and §YTransylvania§!"
