 # ===== cge_megapatch_l_english.yml =====
 CGE_RISK_SUICIDE_TITLE:0 "A Death in Custody"
 CGE_RISK_SUICIDE_DESC:0 "The commandant reports that [?ROOT.cge_risk_general_display^0.GetName] has died by suicide while in our custody. For months, the prisoner had shown no willingness to endure captivity. The guards discovered what had happened too late.\n\nThe news has spread beyond the prison. Questions about our treatment of captured officers have shaken confidence in the government and weakened public support for the war."
 CGE_RISK_SUICIDE_ACK:0 "Notify the family and order an inquiry."
 CGE_RISK_ESCAPE_TITLE:0 "An Empty Cell"
 CGE_RISK_ESCAPE_DESC:0 "A prisoner is missing from the morning count. [?ROOT.cge_risk_general_display^0.GetName], who had refused all cooperation for months, has escaped our custody. The search has failed to recover the officer.\n\n[?ROOT.cge_risk_origin_display^0.GetNameDefCap] is celebrating the return. At home, the embarrassment has damaged the government's standing and public confidence in the conduct of the war."
 CGE_RISK_ESCAPE_ACK:0 "Find out how this was allowed to happen."
 CGE_RISK_LOSS_TT:0 "The incident has cost us §R50 Political Power§!, §R5% War Support§!, and §R5% ruling-party popularity§!."
 CGE_RISK_ESCAPE_LOSS_TT:0 "$CGE_RISK_LOSS_TT$\nThe officer's country receives §G5% War Support§!."
 CGE_NATIVE_ROW_SUICIDE_RECORD_DATED:0 "\n\n§RThis general died in captivity on [?cge_cge_execution_date.GetDateStringNoHourLong].§!"
 CGE_NATIVE_ROW_SUICIDE_RECORD_UNDATED:0 "\n\n§RThis general died in captivity.§!"
 CGE_OVERVIEW_SUICIDE_RECORD_DATED:0 "\n\n§RThis general died in captivity on [?ROOT.cge_overview_selected_execution_date.GetDateStringNoHourLong].§!"
 CGE_OVERVIEW_SUICIDE_RECORD_UNDATED:0 "\n\n§RThis general died in captivity.§!"
 CGE_RECOVERY_TITLE:0 "[?ROOT.cge_recovery_partner.GetNameDefCap] Offers to Repatriate Our Military Commanders"
 CGE_RECOVERY_DESC:0 "[?ROOT.cge_recovery_partner.GetNameDefCap] is holding [?ROOT.cge_recovery_count|0] of our military commanders and has offered to repatriate them in exchange for a temporary economic settlement. If accepted, our Consumer Goods will increase by [?ROOT.cge_recovery_price|.1]% for 90 days, while theirs will be reduced by [?ROOT.cge_recovery_receipts_percent|.1]%.\n\nIf we also hold commanders belonging to them, we may instead arrange a mutual exchange without reparations."
 CGE_RECOVERY_PAY:0 "Accept the reparations terms and recover our commanders."
 CGE_RECOVERY_EXCHANGE:0 "Exchange all officers held by both sides."
 CGE_RECOVERY_REFUSE:0 "We will not accept these terms."
 CGE_RECOVERY_LAPSED:0 "Circumstances have changed. Close the talks."
 CGE_RECOVERY_PAY_TT:0 "Recover §Y[?ROOT.cge_recovery_count|0] officers§!.\nOur Consumer Goods: §R+[?ROOT.cge_recovery_price|.1]%§! for §Y90 days§!.\nTheir Consumer Goods: §G-[?ROOT.cge_recovery_receipts_percent|.1]%§! for the same duration.\n\n§gThe settlement is a fixed 1.5% Consumer Goods for 90 days.§!"
 CGE_RECOVERY_EXCHANGE_TT:0 "Recover §Y[?ROOT.cge_recovery_count|0] officers§! and return §Y[?ROOT.cge_recovery_exchange_count|0] officers§! held by us. No reparations are imposed."
 CGE_RECOVERY_REFUSE_TT:0 "The officers remain in their custody. No reparations are imposed."
 # ===== cge_negotiations_l_english.yml =====
 CGE_NEGOTIATION_REQUEST_TITLE:0 "[?cge_negotiation_partner^0.GetNameDefCap] Requests the Repatriation of Its Military Commanders"
 CGE_NEGOTIATION_REQUEST_DESC:0 "[?cge_negotiation_partner^0.GetNameDefCap] has formally requested the return of [?cge_negotiation_general_count|.0] unrecruited military commanders held in our custody. We may authorize their unconditional repatriation, require a temporary economic settlement in exchange for their return, or keep them detained.\n\nRecruited commanders and POW collaborators are handled separately under the postwar settlement."
 CGE_NEGOTIATION_RETURN:0 "Authorize their unconditional repatriation."
 CGE_NEGOTIATION_DEMAND:0 "Demand reparations for their repatriation."
 CGE_NEGOTIATION_KEEP:0 "Keep the commanders in custody."
 CGE_NEGOTIATION_RETURN_TT:0 "Return the §Y[?cge_negotiation_general_count|.0] eligible officers§! to §Y[?cge_negotiation_partner^0.GetNameDef]§!.\nTheir opinion of us increases by §G50§!.\n§YRecruited generals and POW collaborators§! are handled by their own postwar events."
 CGE_NEGOTIATION_DEMAND_TT:0 "Demand reparations for returning the eligible officers.\n\n§gThey are more likely to accept when the commanders being returned are more valuable and relations are better.§!\n\nA reply arrives in §Yone day§!."
 CGE_NEGOTIATION_REFUSE_TT:0 "Keep the eligible officers imprisoned. Their current §YPatience§! and §YCooperation§! are both §Rhalved§!, and their normal weekly decay is §Rdoubled§! for the rest of this captivity. Existing operation pauses and recruitment protections still apply.\n\nAn independent recipient loses §R50 opinion§! of us and §Rembargoes us§!. Our subject loses only §R25 opinion§! and imposes §Yno embargo§!."
 CGE_NEGOTIATION_ACCEPTED_TITLE:0 "[?cge_negotiation_partner^0.GetNameDefCap] Accepts Our Repatriation Terms"
 CGE_NEGOTIATION_ACCEPTED_DESC:0 "[?cge_negotiation_partner^0.GetNameDefCap] has accepted the proposed economic settlement for the return of its military commanders. For 90 days, our Consumer Goods will be reduced by [?cge_negotiation_reparations_percent|.1]%, while theirs will be increased by [?cge_negotiation_reparations_payer_percent|.1]%.\n\nThe commanders will be transferred once we sign the agreement."
 CGE_NEGOTIATION_SIGN:0 "Sign the repatriation agreement."
 CGE_NEGOTIATION_SIGN_TT:0 "Return §Y[?cge_negotiation_general_count|.0] eligible officers§! to §Y[?cge_negotiation_partner^0.GetNameDef]§!.\nFor §Y90 days§!, gain §YReparations Receipts§! with §G-[?cge_negotiation_reparations_percent|.1]% Consumer Goods§!.\nThey gain §YReparations Obligations§! with §R+[?cge_negotiation_reparations_payer_percent|.1]% Consumer Goods§! for the same period."
 CGE_NEGOTIATION_REFUSED_TITLE:0 "[?cge_negotiation_partner^0.GetNameDefCap] Rejects Our Repatriation Terms"
 CGE_NEGOTIATION_REFUSED_DESC:0 "[?cge_negotiation_partner^0.GetNameDefCap] has rejected our demand for reparations in exchange for the return of [?cge_negotiation_general_count|.0] unrecruited military commanders. The original repatriation request remains unresolved.\n\nWe can release the commanders without conditions or end the talks and keep them in custody."
 CGE_NEGOTIATION_RETURN_AFTER_REFUSAL:0 "Authorize their unconditional repatriation."
