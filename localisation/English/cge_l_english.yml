 CGE_OVERVIEW_COOPERATION_WEEKLY_DECAY:0 "Weekly decay: [?cge_overview_cooperation_weekly_decay|1]%"
 CGE_PATIENCE_WEEKLY_DECAY_TT:0 "§YWeekly Patience Decay§!\nAfter completing §YRecruit General§! or §YRecruit POWs§!: §G0% permanently§!. Both weekly Patience and Cooperation decay stop for this general.\n\nOtherwise, normally: §R-1% every 7 days§!.\nDuring §YHarsher Confinement§!: §R-2% every 7 days§!.\nDuring §YEased Confinement§! and its 70-day after-effect: §G0%§!.\nDuring §YPut on Trial§!: both weekly decays are §Gpaused§!.\n\nA general captured from the opposing side of §Your own civil war§! has §Ghalf the normal Patience and Cooperation decay§!.\nAfter §Rrefusing postwar repatriation§!, this prisoner suffers §Rdouble the normal weekly decay§!. These modifiers stack; existing pauses and recruitment protections still apply."
 CGE_COOPERATION_WEEKLY_DECAY_TT:0 "§YWeekly Cooperation Decay§!\nAfter completing §YRecruit General§! or §YRecruit POWs§!: §G0% permanently§!. Both weekly Patience and Cooperation decay stop for this general.\nDuring §YPut on Trial§!: both weekly decays are §Gpaused§!.\n\nOtherwise, Cooperation falls every 7 days according to current Patience:\n§Y76-100 Patience:§! §R-0.5%§!\n§Y51-75 Patience:§! §R-1%§!\n§Y26-50 Patience:§! §R-1.5%§!\n§Y1-25 Patience:§! §R-2%§!\n§Y0 Patience:§! §R-3%§!\n\nA general captured from the opposing side of §Your own civil war§! has §Ghalf the normal Patience and Cooperation decay§!.\nAfter §Rrefusing postwar repatriation§!, this prisoner suffers §Rdouble the normal weekly decay§!. These modifiers stack; existing pauses and recruitment protections still apply."
