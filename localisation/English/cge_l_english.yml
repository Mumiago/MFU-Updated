l_english:
 # ===== cge_deferred_l_english.yml =====
 CGE_DEFERRED_AWAITING_TITLE:0 "The Generals Wait"
 CGE_DEFERRED_AWAITING_DESC:0 "With the guns silent at last, word has spread through the officers' quarters that [?ROOT.cge_deferred_display_origin^0.GetNameDef] is no more. The generals of the fallen state, both those who took up our cause and those who never did, now spend their days poring over newspapers and pressing the guards for news.\n\nThey have stopped asking when they will be released. Now they ask what will become of their homeland, and who, if anyone, will be permitted to speak for it. Every one of them understands that the answer rests with us."
 CGE_DEFERRED_AWAITING_OK:0 "We will make our decision... eventually."
 CGE_DEFERRED_AWAITING_OK_TT:0 "The repatriation events for §Yboth recruited and unrecruited§! generals of a country that no longer exists will only fire once a suitable recipient exists: one of §Your own subjects§! that is that country or was carved out of its land (if several, the one holding most of it), the §Ywinner of its civil war§!, or a government of that same nation that §Yfought against it alongside us§! (same country, or one that holds cores or claims on its capital and most of its land)."
 # ===== cge_exchange_l_english.yml =====
 CGE_EXCHANGE_BUTTON:0 "Exchange POW"
 CGE_EXCHANGE_BUTTON_TT:0 "§YExchange POW§!\n\n[CGEGetExchangeAvailability]\n\nAcceptance is more likely when the officer we offer is higher level than the officer we request.\nA submitted proposal places this prisoner on a §Y100-day cooldown§!."
 CGE_EXCHANGE_COOLDOWN_TT:0 "§RThis prisoner is on exchange cooldown.§! Select another prisoner or wait for the 100-day cooldown to expire."
 CGE_EXCHANGE_ACTIVE_TT:0 "§RFinish the current exchange event first.§!"
 CGE_EXCHANGE_PRISONER_REQUIRED_TT:0 "§RRequires a living, unrecruited officer who is still in our custody and has another country to return to.§!"
 CGE_EXCHANGE_NO_HOSTAGE_TT:0 "§R[?cge_exchange_ui_partner.GetNameDef] does not hold any of our generals captive.§!"
 CGE_EXCHANGE_READY_TT:0 "§G[?cge_exchange_ui_partner.GetNameDef] holds one or more of our generals. Click to choose whom to bring home.§!"
 CGE_EXCHANGE_SELECT_TITLE:0 "An Officer for an Officer"
 CGE_EXCHANGE_SELECT_DESC:0 "Our representatives have opened a channel to [?cge_exchange_partner^0.GetNameDef]. We can offer the return of [?cge_exchange_offered^0.GetName] in exchange for one of our own officers held in their custody.\n\nChoose whom we should request. Acceptance is more likely when the officer we offer is higher level than the officer we request. A submitted proposal places the offered prisoner on a 100-day cooldown."
 CGE_EXCHANGE_EMPTY_DESC:0 "Our representatives cannot presently confirm a suitable officer for this exchange. The custody lists may have changed: men can be rescued, released, or transferred before an agreement is reached.\n\nNo proposal has been submitted and no prisoner will be handed over. We can revisit the question when their custody is confirmed."
 CGE_EXCHANGE_CANCEL:0 "Never mind."
 CGE_EXCHANGE_CANDIDATE_1:0 "[?cge_exchange_candidate_1^0.GetName] - skill level [?cge_exchange_candidate_1_skill|.0]"
 CGE_EXCHANGE_CANDIDATE_2:0 "[?cge_exchange_candidate_2^0.GetName] - skill level [?cge_exchange_candidate_2_skill|.0]"
 CGE_EXCHANGE_CANDIDATE_3:0 "[?cge_exchange_candidate_3^0.GetName] - skill level [?cge_exchange_candidate_3_skill|.0]"
 CGE_EXCHANGE_PROPOSE_TT:0 "Acceptance is more likely when the officer we offer is higher level than the officer we request.\nThe offered prisoner enters a §Y100-day cooldown§! once the proposal is submitted."
 CGE_EXCHANGE_NAV:0 "[CGEGetExchangeNavigation]"
 CGE_EXCHANGE_NEXT:0 "Review the next three officers."
 CGE_EXCHANGE_FIRST:0 "Return to the first page."
 CGE_EXCHANGE_CLOSE:0 "Put these papers aside for now."
 CGE_EXCHANGE_ACCEPTED_TITLE:0 "The Long Road Home"
 CGE_EXCHANGE_ACCEPTED_DESC:0 "The reply from [?cge_exchange_partner^0.GetNameDef] is favorable. Both sides have accepted the exchange of [?cge_exchange_offered^0.GetName] for [?cge_exchange_requested^0.GetName]. The handover has been completed and both officers are free of enemy custody."
 CGE_EXCHANGE_ACCEPTED_OPTION:0 "Welcome him home."
 CGE_EXCHANGE_ACCEPTED_TT:0 "Political Power: §G+25§!.\nThe two officers have been released."
 CGE_EXCHANGE_REFUSED_TITLE:0 "An Empty Chair at the Table"
 CGE_EXCHANGE_REFUSED_DESC:0 "The authorities of [?cge_exchange_partner^0.GetNameDef] have rejected our proposal. [?cge_exchange_requested^0.GetName] remains in their custody, while [?cge_exchange_offered^0.GetName] remains in ours.\n\n[?cge_exchange_offered^0.GetName] cannot be offered in another exchange for 100 days."
 CGE_EXCHANGE_REFUSED_OPTION:0 "Then both men must wait."
 CGE_EXCHANGE_REFUSED_TT:0 "Political Power: §R-25§!.\nNeither prisoner is released. The offered prisoner is on a §Y100-day cooldown§!."
 CGE_EXCHANGE_LAPSED_TITLE:0 "The Terms Have Changed"
 CGE_EXCHANGE_LAPSED_DESC:0 "Before our representatives could submit the final proposal, the custody situation changed. An officer named in these papers is no longer available for the handover as arranged.\n\nWe cannot exchange men we do not hold, nor demand an officer the other side no longer has. The proposal has been withdrawn without a transfer."
 CGE_EXCHANGE_LAPSED_TT:0 "No Political Power is gained or lost. No new exchange cooldown is started."
 # ===== cge_l_english.yml =====
 CGE_SHOW_EXECUTED_LABEL:0 "Show deceased?"
 CGE_HIDE_EXECUTED_GENERALS_TT:0 "Deceased generals are currently §Yshown§!.\nClick to hide them."
 CGE_SHOW_EXECUTED_GENERALS_TT:0 "Deceased generals are currently §Yhidden§!.\nClick to show them."
 CGE_EXECUTION_RECORD_UNDATED:0 "\n\n§RThis general was executed on an unknown date by [ROOT.GetNameDef].§!"
 CGE_SPRITE_GFX_cge_dead_name_strike_safe_c:0 "GFX_cge_dead_name_strike_safe_c"
 CGE_MOD_NAME: "Captured Generals Expanded"
 CGE_MOD_DESC: "Expands captured generals with cooperation, interrogation, bribery, torture, recruited POW manpower, and recruitment mechanics."
 CGE_WIDGET_BUTTON: "CGE"
 CGE_WIDGET_BUTTON_TT: "Open Captured Generals Expanded."
 CGE_CAPTURED_GENERAL_COUNT_TEST:0 "[?cge_alive_captured_general_count|0]"
 CGE_WINDOW_TITLE: "Captured Generals Expanded"
 CGE_WINDOW_DESC: "Captured general management."
 CGE_CAPTURED_LIST_DESC: "Below are the commanders we have captured. Click on §BOverview§! to see relevant CGE statistics and actions for that commander."
 CGE_UNKNOWN_CAPTURED_GENERAL: "Unknown Captured General"
 CGE_HELD_LOCATION_UNKNOWN: "Unknown location"
 CGE_RANK_GENERAL: "General"
 CGE_RANK_FIELD_MARSHAL: "Field Marshal"
 CGE_ORIGIN_FLAG_TT: "Country of origin: §Y[This.GetNameDef]§!"
