 CGE_POSTWAR_AUTONOMY_ACCEPT:0 "Restore the country under our protection."
 CGE_POSTWAR_AUTONOMY_ACCEPT_TT:0 "[Root.CGEGetPostwarSelectedOriginNameDef] is restored as our puppet. States where we possess a core or claim remain ours."
 CGE_POSTWAR_AUTONOMY_DENY:0 "The matter is settled. Refuse."
 CGE_POSTWAR_AUTONOMY_DENY_TT:0 "§R-100§! Political Power\n[Root.CGEGetPostwarSelectedGeneralName] loses his collaboration status and returns to captivity."
 CGE_POSTWAR_AUTONOMY_DESC:0 "[Root.CGEGetPostwarSelectedGeneralName] insists that cooperation with us during the war did not amount to accepting the permanent disappearance of [Root.CGEGetPostwarSelectedOriginNameDef]. He now demands the restoration of an autonomous government under our protection."
