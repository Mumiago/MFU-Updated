 CGE_POW_TOTAL_TT:0 "Held prisoners from the selected general’s country of origin. The baseline is calculated through CGE’s original working formula: 25% of cumulative casualties you inflicted on that country. Recruiter bonuses apply only to new casualties after assignment. Manpower spent on POW divisions is permanently deducted."
 CGE_POW_RECRUITABLE_TT:0 "The subset of held POWs available to form divisions. A repaired pool begins at 10% recruitable, then converts passively over time. A recruiter increases the conversion rate."
 CGE_POW_WEEKLY_TT:0 "Passive Recruitable POW growth. Base rate: 0.5% of Total POWs per week, even with no recruiter. Recruiter efficiency raises this progressively up to 1.0% of Total POWs per week."
 CGE_POW_EFFICIENCY_TT:0 "Recruiter efficiency bonus. No assigned recruiter gives +0%. The underlying capture/free-rifle baseline remains 25%. Levels 1/2/3/4/5/6/7+ add +5/+9/+13/+17/+21/+23/+25 percentage points; Field Marshals add +2, capped at +25. Current actual capture/free-rifle rate: [?cge_overview_pow_capture_rate|0]%."
 CGE_POW_RECRUITER_EMPTY_TT:0 "No recruiter is assigned to this origin-country POW pool. Complete Recruit POWs with the viewed general, then click this portrait slot to assign them."
 CGE_POW_RECRUITER_ASSIGNED_TT:0 "Assigned recruiter: §Y[CGEGetPOWRecruiterName]§!\nRecruiter efficiency bonus: §Y+[?cge_overview_pow_efficiency|0]%§!\nActual capture/free-rifle rate: §Y[?cge_overview_pow_capture_rate|0]%§!\nClick the portrait to replace the recruiter with the currently viewed eligible Collaborator."
 CGE_POW_UNASSIGN_TT:0 "Remove the current recruiter. Recruiter efficiency bonus returns to +0% and the underlying capture/free-rifle rate returns to 25%."
 CGE_POW_RAISE_TT:0 "Raise one §Y[CGEGetPOWTemplateName]§! in the capital. The template uses the origin-country adjective, defaults to nine infantry battalions, low equipment priority, and the vanilla defensive two-shovels icon. If the canonical template was renamed or deleted, CGE recreates it. Manpower cost is measured from the current template and permanently removed from the POW pool. Line-infantry rifles receive free starting equipment at the current 25–50% actual capture rate."
