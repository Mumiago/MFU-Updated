 CGE_POSTWAR_GOVERNOR_NAV:0 "Let's see the other candidates"
 CGE_POSTWAR_GOVERNOR_NEXT:0 "Next candidates"
 CGE_POSTWAR_GOVERNOR_PROPOSAL_DESC:0 "The new [Root.CGEGetPostwarSelectedOriginAdjective] government remains dependent upon our support. At least one officer from its former armed forces has remained in our service. Installing one of these proven collaborators as military governor could give the new regime local authority and a leader whose relationship with us is already established."
