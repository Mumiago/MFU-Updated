 CGE_HARSHER_CONFINEMENT_BUTTON_FINAL:0 "Harsher Confinement"
 CGE_OVERVIEW_STATUS_IMPRISONED_FINAL:0 "Status: §YImprisoned§!"
 CGE_OVERVIEW_STATUS_EXECUTED_FINAL:0 "Status: §RDeceased§!"
 CGE_PATIENCE_HARSHER_TT:0 "§YHarsher Confinement§!\n§YDuration:§! §Y30 days§!\n§YUp-front cost:§! £pol_power §R50 Political Power§! — fully refunded if canceled.\n\n§YCompletion effect:§! §R-10% Patience§!.\n§YWhile active:§! weekly Patience decay is doubled from §R-1%§! to §R-2%§!. Domestic civil-war prisoners retain their halved decay modifier.\n\n§YInteraction with Eased Confinement:§!\nStarting Harsher Confinement removes any remaining Eased Confinement decay protection. The two confinement operations cannot run at the same time."
 CGE_PATIENCE_THREATEN_TT:0 "§YThreaten§!\n§YDuration:§! §Y30 days§!\n§YUp-front cost:§! £command_power §R10 Command Power§! — fully refunded if canceled.\n\n§YSuccess:§! §G+25% Patience§!.\n§YFailure:§! §R-25% Patience§!.\n\nSuccess depends on the prisoner's military seniority and experience. Higher-level officers are harder to intimidate, and Field Marshals receive an additional resistance bonus.\n§YGeneral success chance:§! L1 §G80%§! | L2 §G70%§! | L3 §G60%§! | L4 §Y50%§! | L5 §R40%§! | L6+ §R30%§!\n§YField Marshal success chance:§! L1 §G60%§! | L2 §Y50%§! | L3 §R40%§! | L4 §R30%§! | L5 §R20%§! | L6+ §R10%§!"
 CGE_PATIENCE_BLACKMAIL_TT:0 "§YBlackmail§!\n§YDuration:§! §Y70 days§!\n§YUp-front cost:§! £pol_power §R100 Political Power§! — fully refunded if canceled.\n§YCompletion effect:§! §G+50% Patience§!.\n§YSpecial rule:§! may only be completed once against each captured general."
 CGE_PATIENCE_INTERROGATE_TT:0 "§YInterrogate§!\n§YDuration:§! §Y70 days§!\n§YOngoing cost:§! §R-10% Political Power Gain§! for as long as the operation remains active; the penalty disappears immediately if canceled.\n\nWithout §YInterrogation Techniques§!: §Y50%§! chance to gain §G+35 Army Intel§! against the general's country of origin; failure causes §R-10% Patience§!.\nWith §YInterrogation Techniques§!: the intel result is §Gguaranteed§!."
 CGE_PATIENCE_TRIAL_TT:0 "§YPut on Trial§!\nDuration: §Y140 days§!.\nCost when started: £pol_power §R50 Political Power§! (refunded if canceled).\nCost while active: §R+0.5% Consumer Goods§!.\nWhile the trial is active, passive weekly §YPatience§! and §YCooperation§! decay are both paused.\nThe full trial can remove at most §R50% Patience§!, even when the harshest choices are combined.\nThe proceedings unfold through several event choices before the final verdict."
 CGE_PATIENCE_EXECUTE_TT:0 "§YExecute§!\nDuration: §Y30 days§!.\nCost when started: £pol_power §R150 Political Power§!, §R-10% Stability§! and §R1 Manpower§! (refunded if canceled).\nRequires exactly §R0% Patience§! and §R0% Cooperation§!.\nEffect when operation concludes: permanently executes the general."
 CGE_COOP_EASED_TT:0 "§YEased Confinement§!\n§YDuration:§! §Y30 days§!\n§YRequirements:§! the prisoner must still be alive and unrecruited; Harsher Confinement cannot currently be active.\n§YUp-front cost:§! £pol_power §R50 Political Power§! — fully refunded if canceled.\n\n§YCompletion effect:§! §G+10% Cooperation§!.\n§YSpecial effect:§! weekly Patience decay is suspended while Eased Confinement is active and remains suspended for §G70 days§! after successful completion.\nCooperation itself continues to decay normally according to the prisoner's Patience."
 CGE_COOP_PROPAGANDIZE_TT:0 "§YPropagandize§!\n§YDuration:§! §Y70 days§!\n§YRequirements:§! the prisoner must still be alive and unrecruited.\n§YOngoing cost:§! §R+0.2% Consumer Goods§! while the operation remains active; this disappears immediately if canceled or completed.\n§YCompletion effect:§! Cooperation gain equals §G30 × ruling-party popularity§!, with a minimum of §G10%§! and maximum of §G30%§!."
 CGE_COOP_BRIBE_TT:0 "§YBribe§!\n§YDuration:§! §Y30 days§!\n§YRequirements:§! the prisoner must still be alive and unrecruited, and must not have been bribed previously.\n§YCompletion effect:§! §G+35% Cooperation§!.\n§YPost-completion cost:§! §R+0.2% Consumer Goods§! for as long as this bribed general remains imprisoned. The penalty is removed when that general is recruited or executed.\n§YSpecial rule:§! one successful bribe per captured general."
 CGE_COOP_EXTRACT_INTEL_TT:0 "§YExtract Intel§!\n§YDuration:§! §Y35 days§!\n§YRequirements:§! at least §Y50% Cooperation§! and §R25% Patience§!.\n§YUp-front cost:§! £command_power §R50 Command Power§! — fully refunded if canceled.\n§YCompletion effect:§! §G+35 Intel§! in Civilian, Army, Navy and Air categories plus §G+20% Cipher Decryption Progress§! against the general's country of origin; the prisoner loses §R10% Patience§!."
 CGE_COOP_RECRUIT_GENERAL_TT:0 "§YRecruit General§!\nDuration: §Y30 days§!.\nNormally requires at least §Y75% Cooperation§! and §Y50% Patience§!.\nA successful §YPlea Agreement§! from Put on Trial reduces these requirements to §Y50% Cooperation§! and §Y25% Patience§! for §Y70 days§!.\n\n§GSuccessful completion permanently stops this general's weekly Patience and Cooperation decay.§!"
 CGE_COOP_RECRUIT_POWS_TT:0 "§YRecruit POWs§!\n§YDuration: 70 days.§!\nRequires §Y100% Cooperation§! and more than §Y75% Patience§!.\n\n§YOn completion:§!\nPermanently unlocks §YPOW Recruitment§! for this general and grants §YCollaborator§! status.\n§GWeekly Patience and Cooperation decay both stop permanently.§!\n\nDuring a war with the general's §Ycountry of origin§!, adds one contribution to §YPOW Collaboration Network§!:\nDaily compliance gain: §G+0.10%§! in territory you occupy from §Ythat country only§!.\nEach additional general completing this operation upgrades the §Ysame national spirit§!. Each country has its own cap of §Y10 contributions§! (§G+1.00% daily compliance gain§!). The bonus appears in the §Yoccupied state’s compliance growth modifiers§!.\n§REach country's bonus expires when your war with it ends.§! The spirit is removed when no active contributions remain.\n\n§RThis general must be alive and must not have completed Recruit POWs before.§!"
 CGE_OVERVIEW_STATUS_RECRUITED_FINAL:0 "Status: §GRecruited§!"
